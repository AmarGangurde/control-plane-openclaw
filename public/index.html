<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenClaw Workspace !</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #21262d;
      --border2: #30363d;
      --text: #e6edf3;
      --muted: #8b949e;
      --violet: #7c3aed;
      --violet-l: #a78bfa;
      --emerald: #10b981;
      --amber: #f59e0b;
      --red: #ef4444;
      --blue: #3b82f6;
    }

    html,
    body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
    }

    /* ── Layout ── */
    .layout {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 900px;
      margin: 0 auto;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .header-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #7c3aed, #4f46e5);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .header-title {
      font-weight: 700;
      font-size: 15px;
    }

    .header-sub {
      font-size: 11px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--emerald);
      margin-left: auto;
      box-shadow: 0 0 6px var(--emerald);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1
      }

      50% {
        opacity: .4
      }
    }

    /* ── Messages ── */
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .messages::-webkit-scrollbar {
      width: 6px;
    }

    .messages::-webkit-scrollbar-track {
      background: transparent;
    }

    .messages::-webkit-scrollbar-thumb {
      background: var(--border2);
      border-radius: 3px;
    }

    .msg {
      display: flex;
      flex-direction: column;
      gap: 6px;
      animation: fadein .2s ease;
    }

    @keyframes fadein {
      from {
        opacity: 0;
        transform: translateY(6px)
      }

      to {
        opacity: 1;
        transform: none
      }
    }

    .msg.user {
      align-items: flex-end;
    }

    .msg.agent {
      align-items: flex-start;
    }

    .bubble {
      max-width: 78%;
      padding: 12px 16px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.6;
      word-wrap: break-word;
      white-space: pre-wrap;
    }

    .msg.user .bubble {
      background: var(--violet);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .msg.agent .bubble {
      background: var(--surface);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .label {
      font-size: 10px;
      color: var(--muted);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .05em;
      padding: 0 4px;
    }

    /* ── Tool execution block ── */
    .tool-block {
      max-width: 78%;
      width: 100%;
      background: #010409;
      border: 1px solid var(--border2);
      border-radius: 10px;
      overflow: hidden;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
    }

    .tool-header {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 14px;
      background: #0d1117;
      border-bottom: 1px solid var(--border);
      color: var(--muted);
    }

    .tool-header .cmd {
      color: var(--amber);
      font-weight: 500;
    }

    .tool-header .badge {
      margin-left: auto;
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 100px;
      font-weight: 700;
    }

    .badge.ok {
      background: rgba(16, 185, 129, .15);
      color: var(--emerald);
    }

    .badge.err {
      background: rgba(239, 68, 68, .15);
      color: var(--red);
    }

    .badge.run {
      background: rgba(245, 158, 11, .15);
      color: var(--amber);
    }

    .tool-output {
      padding: 12px 14px;
      color: #adb5bd;
      white-space: pre-wrap;
      line-height: 1.5;
    }

    /* ── Thinking indicator ── */
    .thinking {
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--muted);
      font-size: 13px;
      padding: 4px 0;
    }

    .dots span {
      display: inline-block;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--violet-l);
      margin: 0 2px;
      animation: bounce .8s infinite alternate;
    }

    .dots span:nth-child(2) {
      animation-delay: .15s;
    }

    .dots span:nth-child(3) {
      animation-delay: .3s;
    }

    @keyframes bounce {
      from {
        transform: translateY(0)
      }

      to {
        transform: translateY(-6px)
      }
    }

    /* ── Input ── */
    .input-area {
      padding: 16px 20px;
      border-top: 1px solid var(--border);
      background: var(--surface);
    }

    .input-row {
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }

    textarea {
      flex: 1;
      resize: none;
      overflow: hidden;
      background: var(--bg);
      border: 1px solid var(--border2);
      border-radius: 12px;
      padding: 12px 16px;
      color: var(--text);
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      line-height: 1.5;
      min-height: 46px;
      max-height: 200px;
      outline: none;
      transition: border-color .15s;
    }

    textarea:focus {
      border-color: var(--violet);
    }

    textarea::placeholder {
      color: var(--muted);
    }

    .send-btn {
      width: 46px;
      height: 46px;
      border-radius: 12px;
      border: none;
      background: var(--violet);
      color: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background .15s, transform .1s;
      flex-shrink: 0;
    }

    .send-btn:hover:not(:disabled) {
      background: #6d28d9;
      transform: scale(1.05);
    }

    .send-btn:disabled {
      opacity: .4;
      cursor: not-allowed;
    }

    .hint {
      font-size: 11px;
      color: var(--muted);
      margin-top: 8px;
      text-align: center;
    }

    /* ── Inline code ── */
    code {
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      background: rgba(255, 255, 255, .08);
      padding: 1px 5px;
      border-radius: 4px;
    }
  </style>
</head>

<body>
  <div class="layout">
    <div class="header">
      <div class="header-icon">🤖</div>
      <div>
        <div class="header-title">OpenClaw Workspace</div>
        <div class="header-sub">Powered by Wrexer · AI Infrastructure Agent</div>
      </div>
      <div class="status-dot" id="statusDot" title="Connected"></div>
    </div>

    <div class="messages" id="messages"></div>

    <div class="input-area">
      <div class="input-row">
        <textarea id="input" placeholder="Ask OpenClaw to build, deploy, or manage your infrastructure…"
          rows="1"></textarea>
        <button class="send-btn" id="sendBtn" title="Send (Enter)">
          <svg width="20" height="20" fill="none" viewBox="0 0 24 24">
            <path fill="currentColor" d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z" />
          </svg>
        </button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </div>

  <script src="app.js"></script>
</body>

</html>
